<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="css/crackcode.css"/>

    <title>Coding Playground</title>
</head>

<body>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="videos.html">Videos</a></li>
            <li class="active"><a href="crackcode.html">Crack the Code</a></li>
            <li><a href="match.html">Match that Code</a></li>
        </ul>
    </nav>

    <div class="banner">
        <video autoplay loop muted class="banner-video">
            <source src="images/planets.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <main class="wrapper">

        <h1>Crack The Code</h1>

        <p class="directions">
            Directions: Enter in letters to guess the word.
        </p>

        <div class="content">

            <!-- Hangman Drawing -->
            <div class="hangman">
                <div class="gallows"></div>
                <div class="head"></div>
                <div class="body"></div>
                <div class="left-arm"></div>
                <div class="right-arm"></div>
                <div class="left-leg"></div>
                <div class="right-leg"></div>
            </div>

            <!-- Word -->
            <div class="word">
                <span>_</span>
                <span>_</span>
                <span>_</span>
                <span>_</span>
                <span>_</span>
                <span>_</span>
            </div>

            <!-- Game Details -->
            <div class="details">

                <p class="hint">
                    Hint:
                    <span>Hint will be shown here</span>
                </p>

                <p class="guesses-left">
                    Guesses Left:
                    <span>8</span>
                </p>

                <p class="wrong-letter">
                    Wrong Letters:
                    <span>None</span>
                </p>

            </div>

            <!-- Letter Buttons -->
            <div class="keyboard">
                <button>A</button>
                <button>B</button>
                <button>C</button>
                <button>D</button>
                <button>E</button>
                <button>F</button>
                <button>G</button>
                <button>H</button>
                <button>I</button>
                <button>J</button>
                <button>K</button>
                <button>L</button>
                <button>M</button>
                <button>N</button>
                <button>O</button>
                <button>P</button>
                <button>Q</button>
                <button>R</button>
                <button>S</button>
                <button>T</button>
                <button>U</button>
                <button>V</button>
                <button>W</button>
                <button>X</button>
                <button>Y</button>
                <button>Z</button>
            </div>

            <button class="play-again">Play Again</button>

        </div>

    </main>

    <script src="js/script.js"></script>

</body>

</html>
